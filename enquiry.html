<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Twomonk Technologies</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#002D5B',
                        teal: '#00A99D',
                        offwhite: '#F8F9FA',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-offwhite text-navy font-sans overflow-x-hidden">

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Fixed Side Navigation (Left) -->
    <div
        class="fixed left-0 top-0 h-screen w-12 border-r border-gray-200 hidden lg:flex flex-col items-center justify-center z-50 bg-white">
        <button id="menu-toggle"
            class="transform -rotate-90 origin-center whitespace-nowrap tracking-widest text-xs font-semibold hover:text-teal transition-colors">
            MENU
        </button>
    </div>

    <!-- Fixed Side Contact (Right) -->
    <div
        class="fixed right-0 top-0 h-screen w-12 border-l border-gray-200 hidden lg:flex flex-col items-center justify-center z-50 bg-white">
        <a href="enquiry.html"
            class="transform rotate-90 origin-center whitespace-nowrap tracking-widest text-xs font-semibold text-teal transition-colors">
            CONTACT US
        </a>
    </div>

    <!-- Full Screen Menu Overlay -->
    <div id="menu-overlay"
        class="fixed inset-0 glass-dark z-[60] flex flex-col items-center justify-center text-white opacity-0 pointer-events-none transition-all duration-500">
        <button id="menu-close"
            class="absolute top-8 right-12 text-sm tracking-widest hover:text-teal font-semibold">CLOSE</button>
        <nav class="flex flex-col gap-8 text-center">
            <a href="index.html" class="text-5xl font-serif hover:text-teal transition-colors menu-link">Home</a>
            <a href="about.html" class="text-5xl font-serif hover:text-teal transition-colors menu-link">About Us</a>
            <a href="services.html" class="text-5xl font-serif hover:text-teal transition-colors menu-link">Services</a>
            <a href="works.html" class="text-5xl font-serif hover:text-teal transition-colors menu-link">Our Works</a>
            <a href="enquiry.html" class="text-5xl font-serif text-teal transition-colors menu-link">Enquiry</a>
        </nav>
    </div>

    <!-- Main Content -->
    <main>
        <section id="enquiry" class="min-h-screen py-24 px-6 md:px-24 bg-white flex flex-col justify-center">
            <div class="container mx-auto max-w-4xl">
                <div class="text-center mb-16 opacity-0 reveal-up">
                    <p class="text-teal font-semibold tracking-widest text-sm mb-4">GET IN TOUCH</p>
                    <h2 class="text-4xl md:text-5xl font-serif mb-6">Send an <span class="text-teal">Enquiry</span></h2>
                </div>

                <form
                    class="grid grid-cols-1 md:grid-cols-2 gap-8 glass p-12 rounded-3xl shadow-2xl opacity-0 reveal-up"
                    style="transition-delay: 100ms">
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-semibold tracking-wider text-gray-500">FULL NAME</label>
                        <input type="text"
                            class="bg-white border-b border-gray-200 py-3 px-4 focus:border-teal outline-none transition-colors rounded-lg"
                            placeholder="John Doe">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-semibold tracking-wider text-gray-500">EMAIL ADDRESS</label>
                        <input type="email"
                            class="bg-white border-b border-gray-200 py-3 px-4 focus:border-teal outline-none transition-colors rounded-lg"
                            placeholder="john@example.com">
                    </div>
                    <div class="flex flex-col gap-2 md:col-span-2">
                        <label class="text-xs font-semibold tracking-wider text-gray-500">SUBJECT</label>
                        <input type="text"
                            class="bg-white border-b border-gray-200 py-3 px-4 focus:border-teal outline-none transition-colors rounded-lg"
                            placeholder="Project Consultation">
                    </div>
                    <div class="flex flex-col gap-2 md:col-span-2">
                        <label class="text-xs font-semibold tracking-wider text-gray-500">MESSAGE</label>
                        <textarea rows="4"
                            class="bg-white border-b border-gray-200 py-3 px-4 focus:border-teal outline-none transition-colors rounded-lg resize-none"
                            placeholder="Tell us about your project..."></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit"
                            class="w-full py-4 bg-teal text-white font-semibold rounded-full hover:bg-navy transition-all shadow-lg hover:shadow-teal/20">
                            SEND ENQUIRY
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- WhatsApp Button -->
    <a href="https://wa.me/971562816806" target="_blank"
        class="fixed bottom-8 left-16 z-50 bg-teal text-white p-3 rounded-full shadow-lg hover:bg-navy transition-all transform hover:scale-110 flex items-center gap-2">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path
                d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.76-.719 2.008-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.937 3.659 1.432 5.631 1.432h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
        </svg>
        <span class="text-sm font-semibold pr-2">WhatsApp Us</span>
    </a>

    <script src="js/main.js"></script>
</body>

</html>
